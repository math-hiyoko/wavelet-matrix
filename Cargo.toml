[package]
name = "wavelet-matrix"
version = "2.2.5"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "wavelet_matrix"
crate-type = ["cdylib"]

[dependencies]
bytemuck = "1.25"
memmap2 = "0.9"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
pyo3 = { version = "0.29", features = ["num-bigint"] }
rayon = "1.12"
tempfile = "3.27"
